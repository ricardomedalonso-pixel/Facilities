  <head>

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#172554" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shopee Fac" />
    <meta name="application-name" content="Shopee Fac" />
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="Shopee Facilities Intelligence - Power BI &amp; Operations Portal" />
    <meta property="og:description" content="Painel executivo e operacional de gestão de ocorrências de Facilities, indicadores de SLA, custos de manutenção, medidas DAX, automação e base de dados dos Hubs e CDs Shopee." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Shopee Facilities PWA Service Worker registrado com sucesso:', reg.scope);
          }).catch((err) => {
            console.warn('Erro ao registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
